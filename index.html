<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 2.5rem 1.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 90%;
      width: 350px;
      position: relative;
    }
    h1 {
      color: #e63946;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 1rem;
      position: relative;
      min-height: 50px;
    }
    button {
      padding: 12px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #yesBtn {
      background-color: #ff4b2b;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
    }
    #noBtn {
      background-color: #e0e0e0;
      color: #333;
      position: absolute;
      right: 20px;
    }
    .hidden {
      display: none;
    }
    .heart {
      position: absolute;
      color: #ff4b2b;
      animation: float 3s linear infinite;
      font-size: 24px;
    }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <h1 id="question">Do you know how much I love you? ❤️</h1>
    <div class="btn-group">
      <button id="yesBtn" onclick="showLove()">Yes! 🥰</button>
      <button id="noBtn" ontouchstart="moveButton()" onclick="moveButton()">No 😜</button>
    </div>
  </div>

  <script>
    function moveButton() {
      const btn = document.getElementById('noBtn');
      // Moves the button to a random spot within the window
      const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40);
      const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40);
      
      btn.style.position = 'fixed';
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }

    function showLove() {
      const card = document.getElementById('mainCard');
      card.innerHTML = `
        <h1>I Love You So Much! 💖</h1>
        <p style="font-size: 1.2rem; color: #555; margin-top: 10px;">
          You mean the entire world to me. Thank you for being you! ✨
        </p>
      `;

      // Trigger heart animation
      setInterval(createHeart, 300);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 2 + 3 + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
  </script>
</body>
</html>
